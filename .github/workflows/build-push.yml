name: Docker build and push

on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: "."
      ecr_repository:
        required: true
        type: string
      registry_aws_account_id:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      aws_ecr_iam_role_arn:
        required: true
        type: string
      build_args:
        required: false
        type: string
        default: ""
      file:
        required: false
        type: string
        default: "Dockerfile"

    outputs:
      image_tag:
        value: ${{ jobs.build-and-push.outputs.image_tag }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_ecr_iam_role_arn }}
          role-session-name: build
          role-skip-session-tagging: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "${{ inputs.registry_aws_account_id }}"

      - name: Set short sha
        id: short-sha
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set tag
        id: set-tag
        run: |
          IMAGE_TAG=${{ github.ref_name }}-${{ env.SHA_SHORT }}-${{ github.run_number }}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ inputs.ecr_repository }}:${{ env.IMAGE_TAG }}
          provenance: false
          build-args: ${{ inputs.build_args }}
          file: ${{ inputs.file }}
          secrets: |
            "github_token=${{ secrets.GITHUB_TOKEN }}"
